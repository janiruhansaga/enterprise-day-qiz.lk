version: '3.8'

services:
  mindpulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindpulse_arena
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATASTORE_TYPE=sqlite
      - DB_PATH=/app/data/enterprise_quiz.sqlite
      # Firebase Configuration (Uncomment and set when DATASTORE_TYPE=firestore)
      # - DATASTORE_TYPE=firestore
      # - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      # - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      # - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      # - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-service-account.json
      - JWT_SECRET=production_super_secret_jwt_key_at_least_32_chars_long
      - JWT_REFRESH_SECRET=production_super_secret_refresh_key_at_least_32_chars_long
      - TEACHER_REGISTRATION_SECRET=TEACHER_SECRET_INVITE_2026
      - ADMIN_REGISTRATION_SECRET=ADMIN_SECRET_INVITE_2026
    volumes:
      - mindpulse_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mindpulse_data:
    driver: local
